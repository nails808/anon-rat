name: Move anon-rat Contents to Root

on:
  workflow_dispatch:
  push:
    paths:
      - 'anon-rat/**'

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Copy files to root and delete anon-rat
        run: |
          if [ -d "anon-rat" ]; then
            shopt -s dotglob nullglob
            cp -rf anon-rat/* ./
            rm -rf anon-rat
          else
            echo "anon-rat directory not found."
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Move contents of anon-rat to root"
          git push
