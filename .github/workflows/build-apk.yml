# Build release APK on GitHub-hosted runners (Flutter + Android SDK)
name: Build APK

on:
  workflow_dispatch:
    inputs:
      c2_url:
        description: "C2 Worker URL (optional if secret C2_URL is set)"
        required: false
        type: string
      upload_symbols:
        description: "Upload Dart obfuscation symbols as artifact"
        required: false
        default: true
        type: boolean
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Flutter release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve C2 defines
        id: defines
        shell: bash
        run: |
          C2="${{ github.event.inputs.c2_url }}"
          if [ -z "$C2" ]; then C2="${{ secrets.C2_URL }}"; fi
          SECRET="${{ secrets.DEVICE_SECRET }}"
          if [ -z "$C2" ]; then
            echo "::warning::C2_URL not set — APK will use compile-time default"
            C2="https://anon-c2.example.workers.dev"
          fi
          if [ -z "$SECRET" ]; then
            echo "::warning::DEVICE_SECRET not set — APK will use compile-time default"
            SECRET="change-me"
          fi
          echo "c2_url=$C2" >> "$GITHUB_OUTPUT"
          # Do not echo secret value

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK (obfuscated)
        env:
          C2_URL: ${{ steps.defines.outputs.c2_url }}
          DEVICE_SECRET: ${{ secrets.DEVICE_SECRET }}
        run: |
          SECRET="${DEVICE_SECRET:-change-me}"
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=C2_URL="$C2_URL" \
            --dart-define=DEVICE_SECRET="$SECRET"

      - name: Locate APK
        id: apk
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee build/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anon-app-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload obfuscation symbols
        if: ${{ github.event.inputs.upload_symbols != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: anon-dart-symbols
          path: build/symbols/
          if-no-files-found: warn
          retention-days: 30

  # Optional: attach APK to a GitHub Release when you push a tag v*
  release:
    name: Attach APK to release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: anon-app-release-apk
          path: dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
