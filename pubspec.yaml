name: anon
description: Anon Privacy Console + device agent (Flutter APK, Cloudflare Worker C2)
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  device_info_plus: ^11.1.1
  battery_plus: ^6.2.0
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
